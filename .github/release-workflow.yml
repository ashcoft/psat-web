name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# semantic-release needs to push the release commit/CHANGELOG, create the Git
# tag, publish the GitHub Release and comment on resolved issues/PRs.
permissions:
  contents: write
  issues: write
  pull-requests: write

# Never run two releases at the same time.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Never release from forks.
    if: github.repository == 'ashcoft/psat-web'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # semantic-release needs the full history and every tag to work out
          # the next version.
          fetch-depth: 0
          # Keep the credentials so @semantic-release/git can push the release
          # commit back to the repository.
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Release
        run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
